<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Карточка товара — макет</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f2f0f5;
            font-family: 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            color: #000000;
        }

        .product-card {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            background: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 18px 30px rgba(0, 0, 0, 0.05), 0 6px 12px rgba(0, 0, 0, 0.04);
            padding: 2rem;
            max-width: 850px;
            width: 100%;
            align-items: flex-start;
        }

        /* ----- ФОТО (ещё больше) ----- */
        .product-photo {
            flex: 0 0 300px;
            width: 300px;
            aspect-ratio: 3/4;
            border-radius: 1rem;
            object-fit: cover;
            background: #f5f5f5;
            border: 1px solid #eae6ef;
        }

        /* ----- ПРАВАЯ ЧАСТЬ ----- */
        .product-details {
            flex: 1 1 280px;
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
            color: #000000;
        }

        /* ----- ЦЕНА ----- */
        .price-block {
            display: flex;
            flex-direction: column;
        }

        .current-price {
            font-size: 2.4rem;
            font-weight: 800;
            color: #000000;
            line-height: 1;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        .old-price {
            font-size: 1.1rem;
            color: #000000;
            text-decoration: line-through;
            font-weight: 500;
            opacity: 0.8;
            margin-top: 0.2rem;
        }

        .savings {
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            margin-top: 0.2rem;
        }

        .savings-amount {
            background-color: #FFD700;
            color: #000000;
            padding: 0.2rem 0.6rem;
            border-radius: 0.3rem;
            font-weight: 800;
        }

        /* ----- ТАЙМЕР И ОСТАТОК (4 плотных квадрата) ----- */
        .timer-stock-row {
            display: flex;
            align-items: stretch;
            margin: 0.4rem 0 0.2rem;
        }

        .sq-block {
            border: 1.5px solid #000000;
            border-right: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.4rem 0.6rem;
            min-width: 3.8rem;
            font-weight: 700;
            background: #ffffff;
            color: #000000;
            text-align: center;
            line-height: 1.2;
        }

        /* последний квадрат (остаток) — голубой фон, белый текст */
        .sq-block.stock-sq {
            background: #1976D2;
            color: #ffffff;
            border-right: 1.5px solid #000000;
        }

        .sq-block:last-child {
            border-right: 1.5px solid #000000;
        }

        .sq-block .sq-num {
            font-size: 1.4rem;
            font-weight: 700;
            color: inherit;
        }

        .sq-block .sq-label {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: lowercase;
            margin-top: 0.1rem;
            color: inherit;
        }

        /* разделители-двоеточия */
        .sq-sep {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.2rem;
            font-size: 1.3rem;
            font-weight: 700;
            background: #ffffff;
            color: #000000;
            border-top: 1.5px solid #000000;
            border-bottom: 1.5px solid #000000;
            line-height: 1;
        }

        /* ----- ЗЕЛЁНАЯ ГАЛОЧКА "МНОГО" И ПОДЧЁРКНУТОЕ "НАШЛИ ДЕШЕВЛЕ?" ----- */
        .meta-row {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            font-size: 0.9rem;
        }

        .many-block {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .green-check {
            color: #2e7d32;
            font-size: 1rem;
            font-weight: bold;
        }

        .many-text {
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 2px;
            color: #000000;
        }

        .cheaper-link {
            color: #000000;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        /* ----- РАЗМЕРЫ (острые кнопки) ----- */
        .size-grid {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .size-label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .size-options {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .size-btn {
            width: 3rem;
            height: 3rem;
            border-radius: 0;
            border: 1.5px solid #000000;
            background: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: default;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            transition: 0.2s;
        }

        /* Активный размер — голубой */
        .size-btn.active {
            background: #1976D2;
            color: #ffffff;
            border-color: #1976D2;
        }

        .size-chart-link {
            font-size: 0.8rem;
            color: #000000;
            text-decoration: underline;
            text-underline-offset: 2px;
            align-self: flex-start;
            margin-top: 0.1rem;
        }

        /* ----- КНОПКИ ДЕЙСТВИЙ (все острые) ----- */
        .action-grid {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            margin-top: 0.2rem;
        }

        .cart-row {
            display: flex;
            align-items: stretch;
            gap: 0.5rem;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            border: 1.5px solid #000000;
            border-radius: 0;
            overflow: hidden;
            background: #ffffff;
        }

        .qty-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            font-weight: 700;
            padding: 0.5rem 0.8rem;
            cursor: default;
            color: #000000;
            font-family: inherit;
            transition: 0.2s;
            line-height: 1;
            border-radius: 0;
        }

        .qty-value {
            min-width: 2.2rem;
            text-align: center;
            font-weight: 700;
            font-size: 1rem;
            color: #000000;
        }

        /* Кнопка "В корзину" — голубая */
        .btn-cart {
            background: #1976D2;
            color: #ffffff;
            border: none;
            border-radius: 0;
            font-weight: 700;
            font-size: 1rem;
            padding: 0.9rem 1.2rem;
            cursor: default;
            font-family: inherit;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .btn-one-click {
            background: #ffffff;
            border: 1.5px solid #000000;
            color: #000000;
            border-radius: 0;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 0.9rem 1.2rem;
            cursor: default;
            font-family: inherit;
            width: 100%;
        }

        hr {
            border: 0.5px solid #e4dfea;
            margin: 0.1rem 0;
        }

        @media (max-width: 600px) {
            .product-card {
                flex-direction: column;
                align-items: center;
            }
            .product-photo {
                width: 100%;
                max-width: 260px;
                aspect-ratio: 1/1;
            }
            .sq-sep {
                display: none;
            }
            .timer-stock-row {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="product-card">
        <!-- ФОТО из папки image / 1.jpg -->
        <img src="image/1.jpg" alt="Товар" class="product-photo">

        <!-- ПРАВАЯ СТОРОНА – только макет -->
        <div class="product-details">
            <!-- 1. Цена -->
            <div class="price-block">
                <div class="current-price">3 150 руб./шт.</div>
                <div class="old-price">3 500 руб.</div>
                <div class="savings">
                    Экономия: <span class="savings-amount">350 руб.</span>
                </div>
            </div>

            <!-- 2. Таймер и остаток (4 квадрата) -->
            <div class="timer-stock-row">
                <!-- дни -->
                <div class="sq-block">
                    <div class="sq-num">119</div>
                    <div class="sq-label">дней</div>
                </div>
                <div class="sq-sep" aria-hidden="true">:</div>
                <!-- часы -->
                <div class="sq-block">
                    <div class="sq-num">19</div>
                    <div class="sq-label">час</div>
                </div>
                <div class="sq-sep" aria-hidden="true">:</div>
                <!-- минуты -->
                <div class="sq-block">
                    <div class="sq-num">13</div>
                    <div class="sq-label">мин</div>
                </div>
                <!-- остаток (голубой фон, белый текст) -->
                <div class="sq-block stock-sq">
                    <div class="sq-num">200</div>
                    <div class="sq-label">шт.</div>
                </div>
            </div>

            <!-- 3. Много + Нашли дешевле? -->
            <div class="meta-row">
                <div class="many-block">
                    <span class="green-check">✔</span>
                    <span class="many-text">Много</span>
                </div>
                <span class="cheaper-link">Нашли дешевле?</span>
            </div>

            <hr>

            <!-- 4. Размер -->
            <div class="size-grid">
                <span class="size-label">Размер</span>
                <div class="size-options">
                    <button class="size-btn">XS</button>
                    <button class="size-btn">S</button>
                    <button class="size-btn active">M</button>
                    <button class="size-btn">L</button>
                </div>
                <span class="size-chart-link">Таблица размеров</span>
            </div>

            <!-- 5. Кнопки действий -->
            <div class="action-grid">
                <div class="cart-row">
                    <div class="quantity-box">
                        <button class="qty-btn">−</button>
                        <span class="qty-value">1</span>
                        <button class="qty-btn">+</button>
                    </div>
                    <button class="btn-cart">В корзину</button>
                </div>
                <button class="btn-one-click">Купить в 1 клик</button>
            </div>
        </div>
    </div>
</body>
</html>
